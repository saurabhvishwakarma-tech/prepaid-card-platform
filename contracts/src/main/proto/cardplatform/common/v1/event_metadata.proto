syntax = "proto3";

package cardplatform.common.v1;

import "google/protobuf/timestamp.proto";

option java_package = "com.cardplatform.contracts.common.v1";
option java_multiple_files = true;
option java_outer_classname = "EventMetadataProto";

message EventMetadata {
  // UUID; consumers store it to discard duplicates (delivery is at-least-once)
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
}