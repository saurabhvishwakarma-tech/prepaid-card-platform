spring:
  application:
    name: transaction-history
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/history_db
    username: history_user
    password: ${HISTORY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    consumer:
      group-id: transaction-history
      # A new consumer group starts from the beginning, so history is rebuilt from everything core kept
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      # Used only to move failed messages to the dead-letter topics
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

server:
  port: 8082
  address: 127.0.0.1

cardplatform:
  history:
    jwk-set-uri: http://127.0.0.1:8081/.well-known/jwks.json
    issuer: card-platform-core