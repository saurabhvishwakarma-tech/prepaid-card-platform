spring:
  application:
    name: card-platform-core
  config:
    # Reads secrets from the repo's .env when run from core/
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/core_db
    username: core_user
    password: ${CORE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  grpc:
    server:
      # The card network's API; REST stays on 8081
      port: 9090
      address: 127.0.0.1
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Events are Protobuf bytes, so no JSON or schema registry is involved
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      # Wait until every in-sync replica has the message before the relay marks it published
      acks: all

server:
  port: 8081
  address: 127.0.0.1

cardplatform:
  jwt:
    issuer: card-platform-core
    access-token-ttl: 15m
    private-key-location: file:../keys/jwt-private.pem
    public-key-location: file:../keys/jwt-public.pem
  card:
    # Six-digit issuer prefix in the 9 range, which no real card network uses
    bin: "990001"
    pan-encryption-key: ${CARD_PAN_ENCRYPTION_KEY}
    pan-hash-key: ${CARD_PAN_HASH_KEY}
    cvv-key: ${CARD_CVV_KEY}
  network:
    client-id: ${NETWORK_CLIENT_ID}
    client-secret: ${NETWORK_CLIENT_SECRET}
  outbox:
    poll-interval: 500ms
  stripe:
    # Test-mode keys only; core refuses to start with a live key
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  funding:
    reconcile-interval: 1m
    # Long enough that the webhook normally gets there first
    reconcile-after: 5m
  payments:
    authorization-ttl: 7d
    expiry-check-interval: 1h