spring:
  application:
    name: card-platform-core
  config:
    # Reads secrets from the repo's .env when run from core/
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/core_db
    username: core_user
    password: ${CORE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  grpc:
    server:
      # The card network's API; REST stays on 8081
      port: 9090
      address: 127.0.0.1

server:
  port: 8081
  address: 127.0.0.1

cardplatform:
  jwt:
    issuer: card-platform-core
    access-token-ttl: 15m
    private-key-location: file:../keys/jwt-private.pem
    public-key-location: file:../keys/jwt-public.pem
  card:
    # Six-digit issuer prefix in the 9 range, which no real card network uses
    bin: "990001"
    pan-encryption-key: ${CARD_PAN_ENCRYPTION_KEY}
    pan-hash-key: ${CARD_PAN_HASH_KEY}
    cvv-key: ${CARD_CVV_KEY}
  network:
    client-id: ${NETWORK_CLIENT_ID}
    client-secret: ${NETWORK_CLIENT_SECRET}